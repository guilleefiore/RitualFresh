spring.application.name=ritualfresh-backend
server.port=8080

spring.datasource.url=${RITUALFRESH_DB_URL:jdbc:postgresql://localhost:5432/ritualfresh}
spring.datasource.username=${RITUALFRESH_DB_USER:ritualfresh}
spring.datasource.password=${RITUALFRESH_DB_PASSWORD:ritualfresh}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Google para login social.
spring.security.oauth2.client.registration.google.client-id=${RITUALFRESH_GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${RITUALFRESH_GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
ritualfresh.auth.oauth2-frontend-base-url=${RITUALFRESH_FRONTEND_BASE_URL:http://localhost:5173}

# Configuracion base del envio de correos.
# Para activar SMTP real, definir RITUALFRESH_MAIL_ENABLED=true y las props spring.mail.* del entorno.
ritualfresh.mail.enabled=${RITUALFRESH_MAIL_ENABLED:false}
ritualfresh.mail.from=${RITUALFRESH_MAIL_FROM:no-reply@ritualfresh.local}
ritualfresh.mail.backend-base-url=${RITUALFRESH_BACKEND_BASE_URL:http://localhost:8080}
ritualfresh.mail.frontend-base-url=${RITUALFRESH_FRONTEND_BASE_URL:http://localhost:5173}

# Seguridad de cookie/CSRF. En local queda compatible con HTTP; activar en despliegues HTTPS.
ritualfresh.session.cookie-secure=${RITUALFRESH_SESSION_COOKIE_SECURE:false}
ritualfresh.session.cookie-same-site=${RITUALFRESH_SESSION_COOKIE_SAME_SITE:Lax}
ritualfresh.security.csrf.enabled=${RITUALFRESH_CSRF_ENABLED:false}

# Seed opcional de usuario administrador inicial.
# Activar con RITUALFRESH_ADMIN_BOOTSTRAP_ENABLED=true y completar los datos.
ritualfresh.admin.bootstrap.enabled=true
ritualfresh.admin.bootstrap.first-name=Admin
ritualfresh.admin.bootstrap.last-name=Test
ritualfresh.admin.bootstrap.document-number=00000000
ritualfresh.admin.bootstrap.phone-number=+54 9 1234567890
ritualfresh.admin.bootstrap.email=admin@ritualfresh.local
ritualfresh.admin.bootstrap.password=AdminPassword123!

# Configuracion de subida de archivos (fotos de perfil).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ritualfresh.storage.upload-dir=${RITUALFRESH_UPLOAD_DIR:/app/uploads}
