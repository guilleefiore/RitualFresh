spring.application.name=ritualfresh-backend
server.port=8080

spring.datasource.url=${RITUALFRESH_DB_URL:jdbc:postgresql://localhost:5432/ritualfresh}
spring.datasource.username=${RITUALFRESH_DB_USER:ritualfresh}
spring.datasource.password=${RITUALFRESH_DB_PASSWORD:ritualfresh}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion base del envio de correos.
# Para activar SMTP real, definir RITUALFRESH_MAIL_ENABLED=true y las props spring.mail.* del entorno.
ritualfresh.mail.enabled=${RITUALFRESH_MAIL_ENABLED:false}
ritualfresh.mail.from=${RITUALFRESH_MAIL_FROM:no-reply@ritualfresh.local}
ritualfresh.mail.backend-base-url=${RITUALFRESH_BACKEND_BASE_URL:http://localhost:8080}
ritualfresh.mail.frontend-base-url=${RITUALFRESH_FRONTEND_BASE_URL:http://localhost:5173}

# Seed opcional de usuario administrador inicial.
# Activar con RITUALFRESH_ADMIN_BOOTSTRAP_ENABLED=true y completar los datos.
ritualfresh.admin.bootstrap.enabled=true
ritualfresh.admin.bootstrap.first-name=Admin
ritualfresh.admin.bootstrap.last-name=Test
ritualfresh.admin.bootstrap.document-number=00000000
ritualfresh.admin.bootstrap.phone-number=+54 9 1234567890
ritualfresh.admin.bootstrap.email=admin@ritualfresh.local
ritualfresh.admin.bootstrap.password=AdminPassword123!
